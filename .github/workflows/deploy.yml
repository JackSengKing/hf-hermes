name: Deploy to Hugging Face
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          clean: true

      - name: 部署到 Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO }}
        run: |
          set -euxo pipefail  # 开启严格模式和调试输出
          
          REPO_URL="https://$HF_TOKEN@huggingface.co/spaces/$HF_REPO"
          echo "=== 部署配置 ==="
          echo "仓库地址: $HF_REPO"
          echo "工作目录: $(pwd)"
          echo "本地文件列表:"
          ls -la
          
          # 清理旧目录
          rm -rf hf_space
          
          # 克隆远程仓库
          echo "=== 克隆远程仓库 ==="
          git clone --depth 1 "$REPO_URL" hf_space
          
          # 自动检测远程默认分支
          cd hf_space
          DEFAULT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "远程默认分支: $DEFAULT_BRANCH"
          cd ..
          
          # 清空远程仓库所有文件（排除 .git 目录）
          echo "=== 清空远程仓库旧文件 ==="
          find hf_space -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} \;
          
          # 复制本地所有文件（排除 .git 目录，关键！）
          echo "=== 复制本地文件 ==="
          rsync -av --exclude='.git' ./ hf_space/
          
          # 进入仓库目录
          cd hf_space
          
          # Git 配置
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          # 检查变更
          echo "=== 检查文件变更 ==="
          git status
          
          # 添加所有变更
          git add -A
          
          # 提交（无变更时优雅退出）
          if ! git diff --cached --quiet; then
            git commit -m "Auto deploy from GitHub $(date +'%Y-%m-%d %H:%M:%S')"
            echo "=== 推送到远程仓库 ==="
            git push --force origin "$DEFAULT_BRANCH"
            echo "✅ 部署成功！"
          else
            echo "ℹ️ 没有文件变更，跳过部署"
          fi
