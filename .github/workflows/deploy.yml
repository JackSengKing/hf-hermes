name: Deploy to Hugging Face

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 部署到 Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO }}
        run: |
          # 克隆你的HF空间
          git clone https://huggingface.co/spaces/$HF_REPO temp-hf
          
          # 复制所有文件过去（覆盖更新）
          cp -rf ./* temp-hf/
          cp -rf ./.??* temp-hf/ 2>/dev/null || true
          
          # 提交并推送
          cd temp-hf
          git config --global user.name "Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Update from GitHub"
          
          # 关键：带token推送
          git push https://$HF_TOKEN@huggingface.co/spaces/$HF_REPO
