name: Deploy to Hugging Face
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # 提前强制使用 Node.js 24，彻底消除警告
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # 升级到 v5，支持 Node.js 24，6 月 2 日后无需修改
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1  # 只拉取最新提交，加快速度
          clean: true     # 自动清理工作区

      - name: 部署到 Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO }}
        run: |
          # 拼接正确的认证仓库地址
          REPO_URL="https://$HF_TOKEN@huggingface.co/spaces/$HF_REPO"
          
          echo "=== 开始部署到 $HF_REPO ==="
          
          # 清理可能存在的旧目录
          rm -rf hf_space
          
          # 克隆远程仓库（添加 --depth 1 加快速度）
          git clone --depth 1 "$REPO_URL" hf_space || {
            echo "❌ 克隆失败！请检查："
            echo "1. HF_TOKEN 是否有写入权限"
            echo "2. HF_REPO 是否正确（JackKing001/Hermes）"
            echo "3. 仓库是否存在且可访问"
            exit 1
          }
          
          # 清空远程仓库所有文件，保证完全同步
          cd hf_space
          git rm -rf . --ignore-unmatch
          cd ..
          
          # 复制本地所有文件（包含隐藏文件）
          cp -rf ./* hf_space/
          cp -rf ./.* hf_space/ 2>/dev/null || true
          
          # 进入仓库目录提交
          cd hf_space
          
          # Git 配置
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          # 添加所有变更
          git add -A
          
          # 提交（无变更时也不会报错）
          git commit -m "Auto deploy from GitHub $(date +'%Y-%m-%d %H:%M:%S')" || {
            echo "ℹ️ 没有文件变更，跳过提交"
            exit 0
          }
          
          # 强制推送，覆盖远程所有变更
          git push --force origin main || {
            echo "❌ 推送失败！请检查 HF_TOKEN 写入权限"
            exit 1
          }
          
          echo "✅ 部署成功！"
