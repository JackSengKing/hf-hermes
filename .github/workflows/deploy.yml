name: Deploy to Hugging Face

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 部署到 HF Docker Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO }}
        run: |
          # 固定正确格式：https://huggingface.co/spaces/用户名/仓库名
          REPO_URL="https://$HF_TOKEN@huggingface.co/spaces/$HF_REPO"
          
          # 克隆并强制同步文件
          git clone $REPO_URL hf_space
          cp -rf ./* hf_space/
          cd hf_space
          
          # 提交推送
          git config --global user.name "Auto Deploy"
          git add .
          git commit -m "Update" || true
          git push $REPO_URL
